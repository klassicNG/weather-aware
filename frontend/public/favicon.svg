<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Semi-Truck Body Gradient (Electric Sky to Royal Blue) -->
    <linearGradient id="truckBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Weather Shield / Lightning Gradient -->
    <linearGradient id="weatherShield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="iconGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0284c7" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Modern Obsidian App Container (Squircle) -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1.5"/>

  <!-- Semi-Truck Silhouette -->
  <g filter="url(#iconGlow)">
    <!-- Trailer Box -->
    <rect x="7" y="21" width="27" height="23" rx="2.5" fill="url(#truckBody)"/>
    <!-- Trailer Ribs / Aerodynamics -->
    <line x1="13" y1="25" x2="13" y2="40" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="19" y1="25" x2="19" y2="40" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="25" y1="25" x2="25" y2="40" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Cab Unit -->
    <path d="M34 26H46C47.5 26 48.8 27.2 49.5 28.5L54 36.5C54.6 37.5 55 38.7 55 40V44H34V26Z" fill="url(#truckBody)"/>
    
    <!-- Windshield -->
    <path d="M37 29H45.5L49 35.5H37V29Z" fill="#090d16"/>
    
    <!-- Front Bumper / Grille Glow -->
    <rect x="53.5" y="40" width="2" height="3.5" rx="1" fill="#38bdf8"/>

    <!-- Wheels with Rims -->
    <!-- Rear Duals -->
    <circle cx="14" cy="46" r="4.5" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="14" cy="46" r="1.5" fill="#e2e8f0"/>
    <circle cx="25" cy="46" r="4.5" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="25" cy="46" r="1.5" fill="#e2e8f0"/>
    <!-- Steer Wheel -->
    <circle cx="46" cy="46" r="4.5" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="46" cy="46" r="1.5" fill="#e2e8f0"/>
  </g>

  <!-- Weather-Aware Radar Shield Badge (Top-Right) -->
  <g transform="translate(39, 7)">
    <!-- Protective Shield -->
    <path d="M10.5 0L21 4V10.5C21 16.5 16 21.5 10.5 23C5 21.5 0 16.5 0 10.5V4L10.5 0Z" fill="url(#weatherShield)"/>
    <path d="M10.5 1.5L19.5 5V10.5C19.5 15.5 15.5 19.8 10.5 21.2C5.5 19.8 1.5 15.5 1.5 10.5V5L10.5 1.5Z" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
    
    <!-- High-Risk Storm Lightning Bolt inside Shield -->
    <path d="M11.5 4.5L6.5 12H11L9.5 18.5L16.5 10H12L13.5 4.5H11.5Z" fill="url(#boltGrad)"/>
  </g>
</svg>